<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader Legal</title>
  <link rel="stylesheet" href="../styles/ui.css">
</head>
<body class="popup needs-consent">
  <header>
    <img src="../icons/icon-48.png" width="22" height="22" alt="">
    <h1 data-i18n="popupTitle"></h1>
  </header>

  <section id="consent" class="panel consent">
    <h2 data-i18n="consentTitle"></h2>
    <p data-i18n="consentIntro"></p>
    <p data-i18n="consentRights"></p>
    <p data-i18n="consentCc"></p>
    <p data-i18n="consentLiability"></p>
    <div class="btns">
      <button id="consent-accept" class="primary" data-i18n="consentAccept"></button>
      <button id="consent-decline" data-i18n="consentDecline"></button>
    </div>
    <p class="faint" data-i18n="consentLocalOnly"></p>
  </section>

  <section id="cc-notice" class="panel consent" hidden>
    <h2 data-i18n="ccNoticeTitle"></h2>
    <p data-i18n="ccNoticeText"></p>
    <p><a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener" data-i18n="ccNoticeLink"></a></p>
    <div class="btns">
      <button id="cc-off" class="primary" data-i18n="ccNoticeOff"></button>
      <button id="cc-keep" data-i18n="ccNoticeKeep"></button>
    </div>
    <p class="faint" data-i18n="consentLocalOnly"></p>
  </section>

  <main>
    <section id="update" class="panel update" hidden></section>
    <section id="jobs"></section>
    <section id="list"></section>
    <section id="empty" hidden>
      <h2 data-i18n="noMediaTitle"></h2>
      <p data-i18n="noMediaText"></p>
      <button id="btn-reload" data-i18n="reload"></button>
    </section>
    <section id="bug-panel" hidden></section>
  </main>

  <footer class="toolbar">
    <button id="btn-settings" class="icon" data-i18n-title="settings" title="Settings">&#9881;</button>
    <button id="btn-sidebar" class="icon" data-i18n-title="sidebarOpen" title="Sidebar" hidden>&#9707;</button>
    <button id="btn-folder" class="icon" data-i18n-title="iconFolder" title="Downloads folder">&#128193;</button>
    <button id="btn-history" class="icon" data-i18n-title="history" title="History">&#128339;</button>
    <button id="btn-help" class="icon" data-i18n-title="iconHelp" title="Help">&#10067;</button>
    <button id="btn-bug" class="icon" data-i18n-title="iconBug" title="Auto-diagnostics">&#128030;</button>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
