name: Site request / improvement
description: Ask for a site to be supported better, or suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: DRM-protected services (Netflix, Disney+ …) are out of scope and will not be supported.
  - type: input
    id: site
    attributes:
      label: Site
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would you like to download or improve?
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics (optional)
      description: The 🐞 button creates a file with the media the extension found on the page.
